<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#171512" />
    <meta name="format-detection" content="telephone=no,date=no,address=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>Nagori (名残)</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/viewer.css" />
  </head>
  <body>
    <main id="frame" aria-live="polite">
      <section id="pairing" class="pairing" hidden>
        <img class="mark" src="/logo.png" alt="" width="56" height="56" />
        <p class="eyebrow">Nagori <span lang="ja">名残</span></p>
        <h1>Connect this frame</h1>
        <p class="hint">Enter the six-digit code from your family dashboard.</p>
        <form id="pair-form">
          <div id="pair-code-fields">
            <label for="code">Pairing code</label>
            <input id="code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required />
            <button type="submit">Connect frame</button>
          </div>
          <button id="pair-link" type="button" hidden>Connect this frame</button>
          <p id="pair-error" class="error" role="alert"></p>
        </form>
      </section>
      <section id="empty" class="empty" hidden>
        <img class="mark" src="/logo.png" alt="" width="56" height="56" />
        <h1>Waiting for a memory</h1>
        <p>Your family can add photos from the dashboard.</p>
      </section>
      <section id="slide" class="slide" hidden>
        <img id="photo-a" class="photo active" alt="" />
        <img id="photo-b" class="photo" alt="" />
        <div id="message" class="message"></div>
        <p id="caption" class="caption"></p>
      </section>
      <p id="connection" class="connection" hidden>Showing saved memories · reconnecting</p>
    </main>
    <aside id="gallery-progress" class="gallery-progress" aria-label="Slideshow controls" hidden>
      <span id="gallery-counter" class="gallery-counter" aria-live="off"></span>
      <span class="gallery-track" aria-hidden="true"><span id="gallery-fill" class="gallery-fill"></span></span>
      <button id="gallery-toggle" class="gallery-toggle" type="button" aria-label="Pause slideshow">Ⅱ</button>
    </aside>
    <script src="/viewer.js"></script>
  </body>
</html>
