name: Deploy Nagori

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-nagori-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      APP_URL: ${{ secrets.APP_URL }}
      FRAME_URL: ${{ secrets.FRAME_URL }}
      INITIAL_OWNER_EMAIL: ${{ secrets.INITIAL_OWNER_EMAIL }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check and test
        run: pnpm check && pnpm test

      - name: Build deployment artifacts
        run: pnpm --filter @nagori/frame build && pnpm --filter @nagori/web build:cloudflare

      - name: Create production worker configuration
        run: |
          test -n "$D1_DATABASE_ID"
          test -n "$APP_URL"
          test -n "$FRAME_URL"
          test -n "$INITIAL_OWNER_EMAIL"
          sed "s|replace-with-d1-id|$D1_DATABASE_ID|g; s|http://localhost:3000|$APP_URL|g; s|http://localhost:8788|$FRAME_URL|g; s|replace-with-owner-email|$INITIAL_OWNER_EMAIL|g; s|\"development\"|\"production\"|" apps/web/wrangler.jsonc > apps/web/wrangler.deploy.jsonc
          sed "s|replace-with-d1-id|$D1_DATABASE_ID|g" apps/frame/wrangler.jsonc > apps/frame/wrangler.deploy.jsonc

      # wrangler is a devDependency of the app packages, not the root, so these
      # run through --filter to pick up each package's own binary and directory.
      - name: Apply D1 migrations
        run: pnpm --filter @nagori/web exec wrangler d1 migrations apply nagori --remote --config wrangler.deploy.jsonc

      - name: Deploy iPad frame
        run: pnpm --filter @nagori/frame exec wrangler deploy --config wrangler.deploy.jsonc

      - name: Deploy dashboard
        run: pnpm --filter @nagori/web exec wrangler deploy --config wrangler.deploy.jsonc
