name: Deploy Nagori

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-nagori-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      APP_URL: ${{ secrets.APP_URL }}
      FRAME_URL: ${{ secrets.FRAME_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check and test
        run: pnpm check && pnpm test

      - name: Build deployment artifacts
        run: pnpm --filter @nagori/frame build && pnpm --filter @nagori/web build:cloudflare

      - name: Create production worker configuration
        run: |
          test -n "$D1_DATABASE_ID"
          test -n "$APP_URL"
          test -n "$FRAME_URL"
          sed "s|replace-with-d1-id|$D1_DATABASE_ID|g; s|http://localhost:3000|$APP_URL|g; s|http://localhost:8788|$FRAME_URL|g; s|\"development\"|\"production\"|" apps/web/wrangler.jsonc > apps/web/wrangler.deploy.jsonc
          sed "s|replace-with-d1-id|$D1_DATABASE_ID|g" apps/frame/wrangler.jsonc > apps/frame/wrangler.deploy.jsonc

      - name: Apply D1 migrations
        run: pnpm exec wrangler d1 migrations apply nagori --remote --config apps/web/wrangler.deploy.jsonc

      - name: Deploy iPad frame
        run: pnpm exec wrangler deploy --config apps/frame/wrangler.deploy.jsonc

      - name: Deploy dashboard
        run: pnpm exec wrangler deploy --config apps/web/wrangler.deploy.jsonc
